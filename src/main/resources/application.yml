server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/securebank?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Must be at least 32 characters. Override with the JWT_SECRET environment variable.
    secret: ${JWT_SECRET:change-this-secret-key-to-something-long-and-random-123}
    expiration-minutes: 60
  fraud:
    # Transfers at or above this amount are held for admin review.
    high-value-threshold: 200000
    # The ML model holds transfers scoring at or above this (0..1).
    hold-score: 0.8
    ml-enabled: true
  timezone: Asia/Kolkata
  admin:
    email: ${ADMIN_EMAIL:admin@securebank.com}
    password: ${ADMIN_PASSWORD:Admin@123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
